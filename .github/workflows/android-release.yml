name: Android release

on:
  push:
    tags: ["android-20*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again, e.g. android-2026.10.14"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Release name and versionCode from the tag
        id: v
        run: |
          [[ "$TAG" =~ ^android-(20[0-9]{2})\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(-([1-9][0-9]?))?$ ]] || { echo "::error::Tag must look like android-2026.10.14 or android-2026.10.14-2, got $TAG"; exit 1; }
          name="${TAG#android-}"
          n="${BASH_REMATCH[5]:-1}"
          # Must match selfupdate::release_code.
          code=$(( (BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]) * 100 + n ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "apk=AddonForge-android-$name.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: UI checks and security gate
        run: node scripts/test-ui.js && node scripts/security-check.mjs

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build APK
        env:
          ADDONFORGE_RELEASE: ${{ steps.v.outputs.name }}
          ADDONFORGE_BUILD: ${{ steps.v.outputs.code }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 \
            --config '{"version":"${{ steps.v.outputs.name }}","bundle":{"android":{"versionCode":${{ steps.v.outputs.code }}}}}'
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "${{ steps.v.outputs.apk }}"

      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "${{ steps.v.outputs.apk }}" | grep -m1 "certificate SHA-256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="AddonForge for Android ${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.v.outputs.apk }}" --clobber
          else
            gh release create "$TAG" "${{ steps.v.outputs.apk }}" --title "$title" --notes-from-tag
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties
