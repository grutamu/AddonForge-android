name: Build and test

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [android]
    paths-ignore:
      - "**.md"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: UI checks
        run: node scripts/test-ui.js
      - name: Security gate
        run: node scripts/security-check.mjs
      - name: cargo test
        working-directory: src-tauri
        env:
          ADDONFORGE_STATE_DIR: ${{ runner.temp }}/addonforge-state
        run: cargo test
